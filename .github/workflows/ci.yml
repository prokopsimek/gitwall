name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Swift packages
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: swift test
        run: |
          # Packages/ also holds documentation; only descend into real packages.
          for manifest in Packages/*/Package.swift; do
            pkg="$(dirname "$manifest")"
            echo "==> $pkg"
            swift test --package-path "$pkg"
          done

  app:
    name: App build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Build (unsigned)
        run: |
          xcodebuild -project Gitwall.xcodeproj -scheme Gitwall -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build
